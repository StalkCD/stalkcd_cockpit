version: "3"
services:
  cockpit:
    image: stalkcd/cockpit
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    links:
      - extended
      - characteristics
    restart: always

  extended:
    image: stalkcd/extended
    build:
      context: ../stalkcd_extended
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    restart: always
    volumes:
      - archive_volume:/Stored data  # Ensure access to GHAhistorydata

  characteristics:
    image: stalkcd/characteristics
    build:
      context: ../stalkcd_characteristics
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      - DATABASE_HOST=db
      - DBKEY= "${DBKEY}"
    restart: always
    volumes:
      - archive_volume:/Stored data  # Save data with date-based renaming

  archive:
    image: archive_image
    build: .
    volumes:
      - archive_volume:/Stored data  # Ensure archive has access
    ports:
      - "8083:80"

# Define named volume
volumes:
  archive_volume:
    driver: local  # This uses Docker's default local volume driver